name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    container:
      # Tag must match @playwright/test in package.json exactly
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      # Runner's uid: checkout files stay writable, Firefox does not run as root
      options: --user 1001
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: E2E
        run: pnpm test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
